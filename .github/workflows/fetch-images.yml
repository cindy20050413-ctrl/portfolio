name: Download images from Wix

# One-time helper: downloads every photo listed in .github/images.json
# into the images/ folder and commits them. Safe to re-run; files that
# already exist are skipped. You can delete this file afterwards.
on:
  push:
    paths:
      - ".github/images.json"
      - ".github/workflows/fetch-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          items = json.load(open(".github/images.json"))
          for path, url in items.items():
              if os.path.exists(path):
                  continue
              os.makedirs(os.path.dirname(path), exist_ok=True)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as r, open(path, "wb") as f:
                  f.write(r.read())
              print("saved", path, os.path.getsize(path))
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add site images from Wix"
          git push
